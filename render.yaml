services:
  - type: web
    name: credibility-checker-rag
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 transformer.app:app
    envVars:
      - key: MISTRAL_API_KEY
        sync: false   # You will paste this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
